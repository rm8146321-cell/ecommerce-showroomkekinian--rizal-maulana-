    <link rel="stylesheet" href="style.css" />

  <body>
    <header>
      <h1>PRODUK</h1>
      <nav>
        <a href="index.html">Beranda</a>

      </nav>

    <main>
      <section class="produk-section">
        <h2>Katalog Produk Unggulan</h2>
        <div class="product-grid">
          <article class="product-card" id="produk-1">
            <img src="aerok.jpg" alt="Aerok Alpha" />
            <div class="product-info">
              <h4>Aerok Alpha</h4>
              <p class="harga">Rp 35.000.000</p>
              <button class="btn-tambah">Tambah ke Keranjang</button>
            </div>

          <article class="product-card" id="produk-2">
            <img src="astrea.jpg" alt="Astrea Grand Bulus" />
            <div class="product-info">
              <h4>Astrea Grand Bulus</h4>
              <p class="harga">Rp 7.500.000</p>
              <button class="btn-tambah">Tambah ke Keranjang</button>
            </div>
          </article>

          <article class="product-card" id="produk-3">
            <img src="cbr.jpg" alt="CBR 600" />
            <div class="product-info">
              <h4>CBR 600</h4>
              <p class="harga">Rp 507.000.000</p>
              <button class="btn-tambah">Tambah ke Keranjang</button>
            </div>
          </article>

          <article class="product-card" id="produk-4">
            <img src="beat.jpg" alt="Beat Street" />
            <div class="product-info">
              <h4>Beat Street</h4>
              <p class="harga">Rp 20.000.000</p>
              <button class="btn-tambah">Tambah ke Keranjang</button>
            </div>
          </article>
        </div>
      </section>
